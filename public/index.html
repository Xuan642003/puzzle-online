<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Xếp Hình Esports VS</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a; color: #fff; user-select: none;
        }

        /* AUTH OVERLAY & CARD */
        .auth-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; padding: 20px;
        }

        .auth-card {
            background: #1e293b; padding: 25px; border-radius: 16px; width: 100%; max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid #334155;
            display: flex; flex-direction: column; gap: 12px;
        }
        .auth-header { text-align: center; margin-bottom: 5px; }
        .auth-header h2 { font-size: 22px; color: #f59e0b; font-style: italic; text-transform: uppercase; }
        .auth-header p { font-size: 12px; color: #94a3b8; }

        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 11px; font-weight: bold; color: #94a3b8; text-transform: uppercase; }
        .form-group input, .form-group select {
            padding: 9px; background: #0f172a; border: 1px solid #334155;
            border-radius: 8px; color: #fff; font-size: 13px; outline: none;
        }
        .form-group input:focus { border-color: #3b82f6; }

        .btn {
            padding: 10px; background: #2563eb; color: white; border: none;
            border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase;
            transition: 0.2s; font-size: 13px;
        }
        .btn:hover { background: #1d4ed8; }
        .btn-green { background: #16a34a; } .btn-green:hover { background: #15803d; }
        .btn-danger { background: #ef4444; } .btn-danger:hover { background: #dc2626; }

        .btn-google {
            background: #ffffff; color: #333; display: flex; align-items: center;
            justify-content: center; gap: 10px; font-weight: bold;
        }
        .btn-google:hover { background: #e2e8f0; }
        .btn-google img { width: 18px; height: 18px; }

        .divider {
            display: flex; align-items: center; text-align: center; color: #64748b; font-size: 11px; margin: 4px 0;
        }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #334155; }
        .divider::before { margin-right: .5em; } .divider::after { margin-left: .5em; }

        .auth-toggle { text-align: center; font-size: 12px; color: #94a3b8; }
        .auth-toggle a { color: #3b82f6; text-decoration: none; font-weight: bold; cursor: pointer; }

        .hidden { display: none !important; }

        /* VS BANNER */
        .vs-container {
            display: flex; align-items: center; justify-content: center;
            gap: 25px; margin-bottom: 15px; width: 100%; max-width: 500px;
        }
        .player-card { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100px; }
        .avatar-box {
            width: 75px; height: 75px; border-radius: 12px; border: 3px solid #3b82f6;
            background: #1e293b; display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-size: 28px;
        }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-box.empty { border-color: #64748b; color: #64748b; }
        .player-name { font-weight: bold; font-size: 12px; text-align: center; }
        .vs-logo { font-size: 38px; font-weight: 900; font-style: italic; color: #ef4444; }

        /* GAMEPLAY LAYOUT */
        .app-container { display: flex; flex-direction: column; width: 100vw; height: 100vh; padding: 12px; gap: 10px; }
        header {
            display: flex; justify-content: space-between; align-items: center;
            background: #1e293b; padding: 10px 20px; border-radius: 10px; border: 1px solid #334155;
        }
        .score-board { font-weight: bold; font-size: 15px; display: flex; gap: 12px; }
        .p1-color { color: #3b82f6; } .p2-color { color: #ef4444; }

        .game-container { flex: 1; display: flex; gap: 15px; justify-content: center; align-items: center; min-height: 0; }
        .board-wrapper { flex: 1; height: 100%; display: flex; justify-content: center; align-items: center; }
        
        #board {
            display: grid; border: 2px solid #475569; background-color: #0f172a;
            box-sizing: content-box; background-repeat: no-repeat; background-position: center;
        }
        .board-tile { box-sizing: border-box; border: 1px dashed rgba(255, 255, 255, 0.15); }

        #pieces-pool {
            flex: 1; height: 100%; border: 2px dashed #334155; background-color: #1e293b;
            border-radius: 10px; padding: 10px; display: flex; flex-wrap: wrap;
            gap: 6px; align-content: flex-start; justify-content: center; overflow-y: auto;
        }
        .piece { cursor: grab; box-sizing: border-box; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <!-- OVERLAY MÀN HÌNH ĐĂNG NHẬP & PHÒNG CHỜ -->
    <div class="auth-overlay" id="overlay">
        
        <!-- THÀNH PHẦN 1: MÀN HÌNH AUTHENTICATION -->
        <div class="auth-card" id="auth-box">
            <div id="auth-form-container">
                <div class="auth-header">
                    <h2 id="form-title">Đăng Nhập</h2>
                    <p id="form-subtitle">Đăng nhập để lưu điểm & đấu Solo Online</p>
                </div>

                <button class="btn btn-google" id="btn-google-login">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G">
                    Đăng nhập bằng Google
                </button>

                <div class="divider">HOẶC GMAIL</div>

                <form onsubmit="return false;">
                    <div class="form-group" id="name-group" style="display: none; margin-bottom: 8px;">
                        <label>Tên Tên Nhân Vật</label>
                        <input type="text" id="display-name" placeholder="Nhập tên hiển thị...">
                    </div>

                    <div class="form-group" style="margin-bottom: 8px;">
                        <label>Email</label>
                        <input type="email" id="email-input" placeholder="example@gmail.com">
                    </div>

                    <div class="form-group" style="margin-bottom: 12px;">
                        <label>Mật Khẩu</label>
                        <input type="password" id="password-input" placeholder="••••••••">
                    </div>

                    <button class="btn" style="width: 100%;" id="btn-auth-submit">Đăng Nhập</button>
                </form>

                <div class="auth-toggle" style="margin-top: 10px;">
                    <span id="toggle-text">Chưa có tài khoản?</span>
                    <a id="toggle-link">Đăng ký ngay</a>
                </div>
            </div>
        </div>

        <!-- THÀNH PHẦN 2: LOBBY SAU KHI ĐĂNG NHẬP -->
        <div class="hidden" id="lobby-box" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
            
            <div class="vs-container">
                <div class="player-card">
                    <div class="avatar-box" id="p1-avatar-box">
                        <span id="p1-empty-icon">👤</span>
                        <img id="p1-avatar-img" class="hidden" src="" alt="P1">
                    </div>
                    <div class="player-name p1-color" id="p1-name-display">Đang chờ...</div>
                </div>

                <div class="vs-logo">VS</div>

                <div class="player-card">
                    <div class="avatar-box empty" id="p2-avatar-box">
                        <span id="p2-empty-icon">👤</span>
                        <img id="p2-avatar-img" class="hidden" src="" alt="P2">
                    </div>
                    <div class="player-name p2-color" id="p2-name-display">Đang chờ...</div>
                </div>
            </div>

            <div class="auth-card">
                <div id="step-join">
                    <div class="form-group" style="margin-bottom: 10px;">
                        <label>Mã Phòng (Room ID)</label>
                        <input type="text" id="room-id" placeholder="Ví dụ: room123">
                    </div>
                    <button class="btn" style="width: 100%;" id="btn-join">Vào Phòng Thi Đấu</button>
                </div>

                <div id="room-status" style="font-size: 12px; color: #94a3b8; text-align: center;"></div>

                <div id="room-settings" class="hidden" style="display: flex; flex-direction: column; gap: 8px;">
                    <div class="form-group">
                        <label>Thể Thức Đấu</label>
                        <select id="bo-select">
                            <option value="1">BO1 (1 Trận Duy Nhất)</option>
                            <option value="3" selected>BO3 (Thắng 2/3 Trận)</option>
                            <option value="5">BO5 (Thắng 3/5 Trận)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Số Mảnh Cắt Puzzle</label>
                        <select id="grid-select">
                            <option value="3">3 x 3 (9 Mảnh - Dễ)</option>
                            <option value="4" selected>4 x 4 (16 Mảnh - Thường)</option>
                            <option value="5">5 x 5 (25 Mảnh - Khó)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Ảnh Gợi Ý Lưới</label>
                        <select id="hint-select">
                            <option value="true" selected>Bật</option>
                            <option value="false">Tắt</option>
                        </select>
                    </div>
                </div>

                <div class="form-group hidden" id="picker-controls">
                    <label id="picker-label" style="color: #f59e0b;"></label>
                    <input type="file" id="image-input" accept="image/*">
                    <button class="btn btn-green" style="margin-top: 6px;" id="btn-submit-img">Bắt Đầu Round</button>
                </div>

                <button class="btn btn-danger" style="margin-top: 10px;" id="btn-logout">Đăng Xuất</button>
            </div>
        </div>

    </div>

    <!-- MAIN GAMEPLAY -->
    <div class="app-container">
        <header>
            <div class="score-board">
                <span class="p1-color" id="p1-score-txt">P1: 0</span>
                <span>-</span>
                <span class="p2-color" id="p2-score-txt">P2: 0</span>
            </div>
            <h3 id="round-info" style="color: #f59e0b;">ROUND 1</h3>
            <div class="score-board">
                <span class="p1-color" id="p1-prog">P1: 0%</span>
                <span class="p2-color" id="p2-prog">P2: 0%</span>
            </div>
        </header>

        <main class="game-container">
            <div class="board-wrapper" id="board-wrapper">
                <div id="board"></div>
            </div>
            <div id="pieces-pool"></div>
        </main>
    </div>

    <!-- FIREBASE SDK SDK V10 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut,
            updateProfile
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // CONFIG FIREBASE CỦA BẠN
        const firebaseConfig = {
            apiKey: "AIzaSyCpqwIbFqleWcid_7oE2GKbHJUCxhEGKDc",
            authDomain: "puzzle-online-auth.firebaseapp.com",
            projectId: "puzzle-online-auth",
            storageBucket: "puzzle-online-auth.firebasestorage.app",
            messagingSenderId: "733126189884",
            appId: "1:733126189884:web:b6c97174bc84e8478a7439",
            measurementId: "G-90X4YDGY7C"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        let currentUser = null;
        let isSignUp = false;

        const authBox = document.getElementById('auth-box');
        const lobbyBox = document.getElementById('lobby-box');
        const formTitle = document.getElementById('form-title');
        const formSubtitle = document.getElementById('form-subtitle');
        const nameGroup = document.getElementById('name-group');
        const btnAuthSubmit = document.getElementById('btn-auth-submit');
        const toggleLink = document.getElementById('toggle-link');
        const toggleText = document.getElementById('toggle-text');

        toggleLink.addEventListener('click', () => {
            isSignUp = !isSignUp;
            if (isSignUp) {
                formTitle.innerText = "Đăng Ký";
                formSubtitle.innerText = "Tạo tài khoản mới để bắt đầu thi đấu";
                btnAuthSubmit.innerText = "Tạo Tài Khoản";
                nameGroup.style.display = "flex";
                toggleText.innerText = "Đã có tài khoản?";
                toggleLink.innerText = "Đăng nhập";
            } else {
                formTitle.innerText = "Đăng Nhập";
                formSubtitle.innerText = "Đăng nhập để lưu điểm & đấu Solo Online";
                btnAuthSubmit.innerText = "Đăng Nhập";
                nameGroup.style.display = "none";
                toggleText.innerText = "Chưa có tài khoản?";
                toggleLink.innerText = "Đăng ký ngay";
            }
        });

        async function saveUserToDatabase(user, customName = null) {
            const userRef = doc(db, "users", user.uid);
            const userSnap = await getDoc(userRef);

            const userData = {
                uid: user.uid,
                email: user.email,
                displayName: customName || user.displayName || user.email.split('@')[0],
                photoURL: user.photoURL || `https://api.dicebear.com/7.x/bottts/svg?seed=${user.uid}`,
                lastLogin: serverTimestamp()
            };

            if (!userSnap.exists()) {
                userData.createdAt = serverTimestamp();
                userData.winCount = 0;
            }

            await setDoc(userRef, userData, { merge: true });
        }

        document.getElementById('btn-google-login').addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, googleProvider);
                await saveUserToDatabase(result.user);
            } catch (error) {
                alert("Lỗi Google Auth: " + error.message);
            }
        });

        btnAuthSubmit.addEventListener('click', async () => {
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('password-input').value.trim();
            const name = document.getElementById('display-name').value.trim();

            if (!email || !password) return alert("Vui lòng nhập Email và Mật khẩu!");

            try {
                if (isSignUp) {
                    if (!name) return alert("Vui lòng nhập Tên hiển thị!");
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    await updateProfile(userCredential.user, { displayName: name });
                    await saveUserToDatabase(userCredential.user, name);
                } else {
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    await saveUserToDatabase(userCredential.user);
                }
            } catch (error) {
                alert("Lỗi: " + error.message);
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                authBox.classList.add('hidden');
                lobbyBox.classList.remove('hidden');
            } else {
                authBox.classList.remove('hidden');
                lobbyBox.classList.add('hidden');
            }
        });

        // ================= GAME SOCKET.IO LOGIC =================
        const socket = io();

        const overlay = document.getElementById('overlay');
        const roomIdIn = document.getElementById('room-id');
        const btnJoin = document.getElementById('btn-join');
        const stepJoin = document.getElementById('step-join');
        const roomStatus = document.getElementById('room-status');

        const p1AvatarImg = document.getElementById('p1-avatar-img');
        const p1EmptyIcon = document.getElementById('p1-empty-icon');
        const p1NameDisplay = document.getElementById('p1-name-display');

        const p2AvatarBox = document.getElementById('p2-avatar-box');
        const p2AvatarImg = document.getElementById('p2-avatar-img');
        const p2EmptyIcon = document.getElementById('p2-empty-icon');
        const p2NameDisplay = document.getElementById('p2-name-display');

        const roomSettings = document.getElementById('room-settings');
        const boSelect = document.getElementById('bo-select');
        const gridSelect = document.getElementById('grid-select');
        const hintSelect = document.getElementById('hint-select');

        const pickerControls = document.getElementById('picker-controls');
        const pickerLabel = document.getElementById('picker-label');
        const imageInput = document.getElementById('image-input');
        const btnSubmitImg = document.getElementById('btn-submit-img');

        const p1ScoreTxt = document.getElementById('p1-score-txt');
        const p2ScoreTxt = document.getElementById('p2-score-txt');
        const roundInfo = document.getElementById('round-info');
        const p1Prog = document.getElementById('p1-prog');
        const p2Prog = document.getElementById('p2-prog');

        const boardWrapper = document.getElementById('board-wrapper');
        const board = document.getElementById('board');
        const piecesPool = document.getElementById('pieces-pool');

        let currentRoomId = '', isHost = false, myIndex = -1;
        let selectedImageSrc = '', draggedPieceId = null, totalPiecesCount = 16;
        let currentBoType = 3;

        btnJoin.addEventListener('click', () => {
            currentRoomId = roomIdIn.value.trim();
            if (!currentRoomId) return alert("Vui lòng nhập Mã Phòng!");
            if (!currentUser) return alert("Bạn chưa đăng nhập!");

            const username = currentUser.displayName || currentUser.email.split('@')[0];
            const avatar = currentUser.photoURL || `https://api.dicebear.com/7.x/bottts/svg?seed=${currentUser.uid}`;

            socket.emit('joinRoom', { roomId: currentRoomId, username, avatar });
            stepJoin.classList.add('hidden');
        });

        [boSelect, gridSelect, hintSelect].forEach(elem => {
            elem.addEventListener('change', () => {
                if (isHost) {
                    socket.emit('updateRoomSettings', {
                        roomId: currentRoomId,
                        boType: boSelect.value,
                        gridSize: gridSelect.value,
                        showHint: hintSelect.value === 'true'
                    });
                }
            });
        });

        socket.on('updateRoomState', ({ players, boType, gridSize, showHint }) => {
            myIndex = players.findIndex(p => p.id === socket.id);
            isHost = (myIndex === 0);

            if (players[0]) {
                p1AvatarImg.src = players[0].avatar;
                p1AvatarImg.classList.remove('hidden');
                p1EmptyIcon.classList.add('hidden');
                p1NameDisplay.innerText = players[0].username;
            }

            if (players[1]) {
                p2AvatarImg.src = players[1].avatar;
                p2AvatarImg.classList.remove('hidden');
                p2EmptyIcon.classList.add('hidden');
                p2AvatarBox.classList.remove('empty');
                p2NameDisplay.innerText = players[1].username;
            } else {
                p2AvatarImg.classList.add('hidden');
                p2EmptyIcon.classList.remove('hidden');
                p2AvatarBox.classList.add('empty');
                p2NameDisplay.innerText = "Đang chờ...";
            }

            roomSettings.classList.remove('hidden');
            boSelect.disabled = !isHost;
            gridSelect.disabled = !isHost;
            hintSelect.disabled = !isHost;

            boSelect.value = boType;
            gridSelect.value = gridSize;
            hintSelect.value = showHint.toString();
            currentBoType = boType;

            if (players.length < 2) {
                roomStatus.innerText = "⏳ Đang chờ người chơi thứ 2...";
                pickerControls.classList.add('hidden');
            } else {
                roomStatus.innerText = "⚔️ Đã đủ 2 người! Chọn ảnh thi đấu...";
                checkTurnToPickImage(1, boType, players);
            }
        });

        function checkTurnToPickImage(round, boType, players) {
            pickerControls.classList.add('hidden');
            let pickerIndex = getPickerForRound(round, boType);

            if (pickerIndex === 'RANDOM') {
                pickerControls.classList.remove('hidden');
                pickerLabel.innerText = "🎲 CẢ 2 CHỌN ÁNH (Server Random):";
            } else if (myIndex === pickerIndex) {
                pickerControls.classList.remove('hidden');
                pickerLabel.innerText = `📸 LƯỢT BẠN chọn ảnh cho Round ${round}:`;
            } else {
                roomStatus.innerText = `⏳ Đang chờ ${players[pickerIndex].username} chọn ảnh...`;
            }
        }

        function getPickerForRound(round, boType) {
            if (boType === 1) return 'RANDOM';
            if (boType === 3) return round === 1 ? 0 : (round === 2 ? 1 : 'RANDOM');
            if (boType === 5) return round % 2 !== 0 ? (round === 5 ? 'RANDOM' : 0) : 1;
        }

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => { selectedImageSrc = evt.target.result; };
                reader.readAsDataURL(file);
            }
        });

        btnSubmitImg.addEventListener('click', () => {
            if (!selectedImageSrc) return alert("Vui lòng chọn 1 file ảnh!");
            socket.emit('submitImage', { roomId: currentRoomId, imageSrc: selectedImageSrc });
            pickerControls.classList.add('hidden');
            roomStatus.innerText = "⏳ Đã tải ảnh! Đợi trận đấu bắt đầu...";
        });

        socket.on('gameStarted', ({ imageSrc, gridSize, showHint, currentRound, scores, players }) => {
            overlay.classList.add('hidden');
            roundInfo.innerText = `ROUND ${currentRound}`;
            updateScoreDisplay(scores, players);
            initBoard(imageSrc, gridSize, showHint);
        });

        function updateScoreDisplay(scores, players) {
            p1ScoreTxt.innerText = `${players[0].username}: ${scores[players[0].id] || 0}`;
            p2ScoreTxt.innerText = `${players[1] ? players[1].username : 'P2'}: ${scores[players[1] ? players[1].id : ''] || 0}`;
        }

        function initBoard(imgSrc, size, showHint) {
            board.innerHTML = ''; piecesPool.innerHTML = '';
            p1Prog.innerText = "0%"; p2Prog.innerText = "0%";
            totalPiecesCount = size * size;

            const img = new Image();
            img.onload = () => {
                const cols = size, rows = size;
                const maxW = boardWrapper.clientWidth - 20, maxH = boardWrapper.clientHeight - 20;
                const aspectRatio = img.naturalWidth / img.naturalHeight;

                let displayW = (maxW / maxH > aspectRatio) ? maxH * aspectRatio : maxW;
                let displayH = displayW / aspectRatio;
                const pW = displayW / cols, pH = displayH / rows;

                board.style.width = `${displayW}px`; board.style.height = `${displayH}px`;
                board.style.gridTemplateColumns = `repeat(${cols}, ${pW}px)`;
                board.style.gridTemplateRows = `repeat(${rows}, ${pH}px)`;

                if (showHint) {
                    board.style.backgroundImage = `linear-gradient(rgba(15,23,42,0.75), rgba(15,23,42,0.75)), url(${imgSrc})`;
                    board.style.backgroundSize = `${displayW}px ${displayH}px`;
                } else {
                    board.style.backgroundImage = 'none';
                }

                let pieces = [];
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const idx = r * cols + c;
                        const tile = document.createElement('div');
                        tile.classList.add('board-tile');
                        tile.dataset.index = idx;
                        tile.addEventListener('dragover', e => e.preventDefault());
                        tile.addEventListener('drop', handleDropTile);
                        board.appendChild(tile);

                        const p = document.createElement('div');
                        p.classList.add('piece'); p.id = `p-${idx}`; p.dataset.correctIndex = idx;
                        p.draggable = true; p.style.width = `${pW}px`; p.style.height = `${pH}px`;
                        p.style.backgroundImage = `url(${imgSrc})`;
                        p.style.backgroundSize = `${displayW}px ${displayH}px`;
                        p.style.backgroundPosition = `-${c * pW}px -${r * pH}px`;
                        p.addEventListener('dragstart', e => {
                            draggedPieceId = e.target.id;
                            e.dataTransfer.setData('text/plain', e.target.id);
                        });
                        pieces.push(p);
                    }
                }
                pieces.sort(() => Math.random() - 0.5);
                pieces.forEach(p => piecesPool.appendChild(p));

                piecesPool.addEventListener('dragover', e => e.preventDefault());
                piecesPool.addEventListener('drop', e => {
                    e.preventDefault();
                    const p = document.getElementById(draggedPieceId);
                    if (p) piecesPool.appendChild(p);
                    checkProgress();
                });
            };
            img.src = imgSrc;
        }

        function handleDropTile(e) {
            e.preventDefault();
            const tile = e.currentTarget;
            const piece = document.getElementById(draggedPieceId);
            if (piece && tile.children.length === 0) {
                tile.appendChild(piece);
                checkProgress();
            }
        }

        function checkProgress() {
            const tiles = board.querySelectorAll('.board-tile');
            let correctCount = 0;
            tiles.forEach(tile => {
                const child = tile.children[0];
                if (child && child.dataset.correctIndex === tile.dataset.index) correctCount++;
            });

            socket.emit('updateProgress', { roomId: currentRoomId, placedPieces: correctCount, totalPieces: totalPiecesCount });

            if (correctCount === totalPiecesCount) {
                const myName = currentUser.displayName || currentUser.email.split('@')[0];
                socket.emit('playerWin', { roomId: currentRoomId, username: myName });
            }
        }

        socket.on('playerProgressUpdate', ({ socketId, progress }) => {
            if (socketId === socket.id) p1Prog.innerText = `Bạn: ${progress}%`;
            else p2Prog.innerText = `Đối thủ: ${progress}%`;
        });

        socket.on('roundOver', ({ roundWinner, nextRound, scores, players }) => {
            alert(`🎉 ${roundWinner.toUpperCase()} chiến thắng Round này!`);
            selectedImageSrc = '';
            overlay.classList.remove('hidden');
            updateScoreDisplay(scores, players);
            checkTurnToPickImage(nextRound, currentBoType, players);
        });

        socket.on('matchOver', ({ winner }) => {
            alert(`🏆 CHÚC MỪNG ${winner.toUpperCase()} CHIẾN THẮNG CHUNG CUỘC!`);
            location.reload();
        });
    </script>
</body>
</html>
