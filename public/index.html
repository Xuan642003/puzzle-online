<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Xếp Hình Solo Online</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100vw; height: 100vh; overflow: hidden;
            font-family: Arial, sans-serif; background-color: #f0f2f5; user-select: none;
        }

        /* Lobby / Đăng nhập phòng */
        .lobby-overlay {
            position: fixed; top:0; left:0; width:100vw; height:100vh;
            background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .lobby-card {
            background: white; padding: 25px; border-radius: 12px; width: 350px;
            display: flex; flex-direction: column; gap: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .lobby-card h2 { text-align: center; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group input { padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
        .btn { padding: 10px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #0056b3; }
        .hidden { display: none !important; }

        /* Interface Game */
        .app-container { display: flex; flex-direction: column; width: 100%; height: 100%; padding: 10px; gap: 10px; }
        header {
            display: flex; justify-content: space-between; align-items: center;
            background: #fff; padding: 10px 20px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .progress-box { display: flex; gap: 20px; font-weight: bold; }

        .game-container { flex: 1; display: flex; gap: 15px; justify-content: center; align-items: center; min-height: 0; }
        .board-wrapper { flex: 1; height: 100%; display: flex; justify-content: center; align-items: center; }
        
        #board { display: grid; border: 2px solid #333; background-color: #e0e0e0; box-sizing: content-box; }
        .board-tile { box-sizing: border-box; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15); }

        #pieces-pool {
            flex: 1; height: 100%; border: 2px dashed #888; background-color: #fff;
            border-radius: 8px; padding: 10px; display: flex; flex-wrap: wrap;
            gap: 4px; align-content: flex-start; justify-content: center; overflow-y: auto;
        }
        .piece { cursor: grab; box-sizing: border-box; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <!-- MÀN HÌNH TẠO / THAM GIA PHÒNG -->
    <div class="lobby-overlay" id="lobby">
        <div class="lobby-card">
            <h2>⚔️ Thi Đấu Online</h2>
            <div class="form-group">
                <label>Tên người chơi:</label>
                <input type="text" id="username" placeholder="Nhập tên của bạn">
            </div>
            <div class="form-group">
                <label>Mã Phòng (Room ID):</label>
                <input type="text" id="room-id" placeholder="VD: room123">
            </div>
            <button class="btn" id="btn-join">Vào Phòng</button>

            <div id="room-status" style="font-size:13px; color:#666; text-align:center;"></div>

            <!-- Chỉ chủ phòng mới chọn ảnh -->
            <div class="form-group hidden" id="host-controls">
                <label>Chọn ảnh thi đấu:</label>
                <input type="file" id="image-input" accept="image/*">
                <button class="btn" style="background:#28a745; margin-top:10px;" id="btn-start">Bắt Đầu Trận Đấu</button>
            </div>
        </div>
    </div>

    <!-- MÀN HÌNH CHÍNH GAME -->
    <div class="app-container">
        <header>
            <div class="progress-box">
                <span style="color:#007bff;" id="p1-status">Bạn: 0%</span>
                <span style="color:#d9534f;" id="p2-status">Đối thủ: 0%</span>
            </div>
            <h2 id="game-status" style="font-size:16px; color:#28a745;">Đang chờ người chơi...</h2>
        </header>

        <main class="game-container">
            <div class="board-wrapper" id="board-wrapper">
                <div id="board"></div>
            </div>
            <div id="pieces-pool"></div>
        </main>
    </div>

    <script>
        const socket = io();

        // DOM
        const lobby = document.getElementById('lobby');
        const usernameInput = document.getElementById('username');
        const roomIdInput = document.getElementById('room-id');
        const btnJoin = document.getElementById('btn-join');
        const roomStatus = document.getElementById('room-status');
        const hostControls = document.getElementById('host-controls');
        const imageInput = document.getElementById('image-input');
        const btnStart = document.getElementById('btn-start');

        const p1Status = document.getElementById('p1-status');
        const p2Status = document.getElementById('p2-status');
        const gameStatus = document.getElementById('game-status');

        const boardWrapper = document.getElementById('board-wrapper');
        const board = document.getElementById('board');
        const piecesPool = document.getElementById('pieces-pool');

        let myUsername = '';
        let currentRoomId = '';
        let isHost = false;
        let loadedImageSrc = '';
        let draggedPieceId = null;
        let totalPiecesCount = 0;

        // 1. Kết nối Phòng
        btnJoin.addEventListener('click', () => {
            myUsername = usernameInput.value.trim();
            currentRoomId = roomIdInput.value.trim();

            if (!myUsername || !currentRoomId) {
                alert("Vui lòng nhập đầy đủ tên và Mã phòng!");
                return;
            }

            socket.emit('joinRoom', { roomId: currentRoomId, username: myUsername });
            btnJoin.disabled = true;
        });

        // Lắng nghe cập nhật phòng
        socket.on('updatePlayers', (players) => {
            roomStatus.innerText = `Đã vào phòng. Số người hiện tại: ${players.length}/2`;
            if (players[0].id === socket.id) {
                isHost = true;
                hostControls.classList.remove('hidden'); // Người vào đầu tiên làm chủ phòng
            }
        });

        socket.on('roomReady', (msg) => {
            roomStatus.innerText = msg;
        });

        // 2. Load ảnh và bắt đầu game
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => { loadedImageSrc = event.target.result; };
                reader.readAsDataURL(file);
            }
        });

        btnStart.addEventListener('click', () => {
            if (!loadedImageSrc) {
                alert("Vui lòng chọn ảnh trước!");
                return;
            }
            socket.emit('startGame', { roomId: currentRoomId, imageSrc: loadedImageSrc, totalPieces: 16 });
        });

        // Lắng nghe sự kiện bắt đầu game từ Server gửi tới cả 2 máy
        socket.on('gameStarted', ({ imageSrc, totalPieces }) => {
            lobby.classList.add('hidden');
            gameStatus.innerText = "Trận đấu đang diễn ra!";
            initBoard(imageSrc);
        });

        // 3. Khởi tạo Bảng ghép
        function initBoard(imgSrc) {
            board.innerHTML = '';
            piecesPool.innerHTML = '';

            const img = new Image();
            img.onload = () => {
                const cols = 4, rows = 4; // Cố định 4x4 (16 mảnh)
                totalPiecesCount = cols * rows;

                const maxW = boardWrapper.clientWidth - 10;
                const maxH = boardWrapper.clientHeight - 10;
                const aspectRatio = img.naturalWidth / img.naturalHeight;

                let displayWidth = (maxW / maxH > aspectRatio) ? maxH * aspectRatio : maxW;
                let displayHeight = displayWidth / aspectRatio;

                const pieceW = displayWidth / cols;
                const pieceH = displayHeight / rows;

                board.style.width = `${displayWidth}px`;
                board.style.height = `${displayHeight}px`;
                board.style.gridTemplateColumns = `repeat(${cols}, ${pieceW}px)`;
                board.style.gridTemplateRows = `repeat(${rows}, ${pieceH}px)`;

                let pieces = [];

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const index = r * cols + c;

                        const tile = document.createElement('div');
                        tile.classList.add('board-tile');
                        tile.dataset.index = index;
                        tile.addEventListener('dragover', e => e.preventDefault());
                        tile.addEventListener('drop', handleDropTile);
                        board.appendChild(tile);

                        const piece = document.createElement('div');
                        piece.classList.add('piece');
                        piece.id = `piece-${index}`;
                        piece.dataset.correctIndex = index;
                        piece.draggable = true;
                        piece.style.width = `${pieceW}px`;
                        piece.style.height = `${pieceH}px`;
                        piece.style.backgroundImage = `url(${imgSrc})`;
                        piece.style.backgroundSize = `${displayWidth}px ${displayHeight}px`;
                        piece.style.backgroundPosition = `-${c * pieceW}px -${r * pieceH}px`;

                        piece.addEventListener('dragstart', e => {
                            draggedPieceId = e.target.id;
                            e.dataTransfer.setData('text/plain', e.target.id);
                        });

                        pieces.push(piece);
                    }
                }

                pieces.sort(() => Math.random() - 0.5);
                pieces.forEach(p => piecesPool.appendChild(p));

                piecesPool.addEventListener('dragover', e => e.preventDefault());
                piecesPool.addEventListener('drop', e => {
                    e.preventDefault();
                    const p = document.getElementById(draggedPieceId);
                    if (p) piecesPool.appendChild(p);
                    checkProgress();
                });
            };
            img.src = imgSrc;
        }

        function handleDropTile(e) {
            e.preventDefault();
            const tile = e.currentTarget;
            const piece = document.getElementById(draggedPieceId);

            if (piece && tile.children.length === 0) {
                tile.appendChild(piece);
                checkProgress();
            }
        }

        // Tính % tiến độ và đồng bộ lên Server
        function checkProgress() {
            const tiles = board.querySelectorAll('.board-tile');
            let correctCount = 0;

            tiles.forEach(tile => {
                const child = tile.children[0];
                if (child && child.dataset.correctIndex === tile.dataset.index) {
                    correctCount++;
                }
            });

            // Gửi % về Server
            socket.emit('updateProgress', {
                roomId: currentRoomId,
                placedPieces: correctCount,
                totalPieces: totalPiecesCount
            });

            // Nếu đúng hết 100% mảnh -> Báo Thắng
            if (correctCount === totalPiecesCount) {
                socket.emit('playerWin', { roomId: currentRoomId, username: myUsername });
            }
        }

        // Lắng nghe % tiến độ đối thủ từ Server
        socket.on('playerProgressUpdate', ({ socketId, username, progress }) => {
            if (socketId === socket.id) {
                p1Status.innerText = `Bạn (${username}): ${progress}%`;
            } else {
                p2Status.innerText = `Đối thủ (${username}): ${progress}%`;
            }
        });

        // Kết thúc game
        socket.on('gameOver', ({ winner }) => {
            alert(`🏆 TRẬN ĐẤU KẾT THÚC! NGƯỜI THẮNG: ${winner.toUpperCase()}`);
            location.reload();
        });
    </script>
</body>
</html>
