<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin Management</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 30px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #1e293b; padding: 24px; border-radius: 12px; margin-bottom: 24px; border: 1px solid #334155; }
        h2, h3 { margin-top: 0; color: #f1f5f9; }
        input, select, button { padding: 12px; margin: 8px 0; width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; }
        button { background: #2563eb; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #1d4ed8; }
        .btn-logout { background: #64748b; width: auto; float: right; padding: 6px 16px; margin: 0; }
        .hidden { display: none !important; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #334155; padding: 12px; text-align: left; }
        th { background: #0f172a; color: #94a3b8; }
        .btn-del { background: #ef4444; width: auto; padding: 6px 12px; margin: 0; }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- FORM ĐĂNG NHẬP ADMIN -->
        <div id="loginSection" class="card" style="max-width: 400px; margin: 50px auto;">
            <h3>🔐 Đăng Nhập Admin</h3>
            <form id="loginForm">
                <input type="text" id="adminUser" placeholder="Tài khoản Admin" required>
                <input type="password" id="adminPass" placeholder="Mật khẩu" required>
                <button type="submit">Đăng Nhập</button>
            </form>
            <div id="loginError" style="color: #ef4444; margin-top: 10px; font-size: 13px;"></div>
        </div>

        <!-- GIAO DIỆN QUẢN TRỊ -->
        <div id="adminSection" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>🔥 Admin Management (Firebase)</h2>
                <button class="btn-logout" onclick="logout()">Đăng xuất</button>
            </div>

            <div class="card">
                <h3>Thêm Nhiệm Vụ Hàng Ngày</h3>
                <form id="questForm">
                    <input type="text" id="title" placeholder="Tên nhiệm vụ (VD: Chơi 3 trận Rank)" required>
                    <input type="text" id="desc" placeholder="Mô tả ngắn">
                    <select id="type">
                        <option value="PLAY_RANK">Chơi trận Rank</option>
                        <option value="WIN_SOLO">Thắng trận Solo</option>
                        <option value="COMPLETE_PUZZLE">Ghép xong 1 bức tranh</option>
                    </select>
                    <input type="number" id="target" placeholder="Mục tiêu (VD: 3)" required>
                    <input type="number" id="rewardExp" placeholder="Điểm EXP thưởng (VD: 150)" required>
                    <button type="submit" id="submitBtn">➕ Thêm Nhiệm Vụ</button>
                </form>
            </div>

            <div class="card">
                <h3>Danh Sách Nhiệm Vụ Hiện Tại</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Tên & Mô tả</th>
                            <th>Loại</th>
                            <th>Cần đạt</th>
                            <th>Thưởng</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="questList">
                        <tr><td colspan="5" style="text-align:center;">Đang tải dữ liệu...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        // Cấu hình tài khoản & mật khẩu Admin cố định
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "123456";

        // Cấu hình Firebase
        const firebaseConfig = {
            apiKey: "AIzaSy...", 
            authDomain: "puzzle-online-auth.firebaseapp.com",
            databaseURL: "https://puzzle-online-auth-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "puzzle-online-auth",
            storageBucket: "puzzle-online-auth.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const questsRef = db.ref('daily_quests');

        // Kiểm tra xem đã đăng nhập chưa từ SessionStorage
        if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
            showAdminDashboard();
        }

        // Xử lý đăng nhập
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('adminUser').value;
            const p = document.getElementById('adminPass').value;

            if (u === ADMIN_USER && p === ADMIN_PASS) {
                sessionStorage.setItem('isAdminLoggedIn', 'true');
                showAdminDashboard();
            } else {
                document.getElementById('loginError').innerText = "Tài khoản hoặc mật khẩu không chính xác!";
            }
        });

        function showAdminDashboard() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('adminSection').classList.remove('hidden');
            loadQuests();
        }

        function logout() {
            sessionStorage.removeItem('isAdminLoggedIn');
            location.reload();
        }

        // Thêm nhiệm vụ
        document.getElementById('questForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;

            const newQuest = {
                title: document.getElementById('title').value,
                desc: document.getElementById('desc').value,
                type: document.getElementById('type').value,
                target: Number(document.getElementById('target').value),
                rewardExp: Number(document.getElementById('rewardExp').value),
                createdAt: Date.now()
            };

            questsRef.push(newQuest)
                .then(() => {
                    alert("✅ Đã thêm nhiệm vụ thành công!");
                    document.getElementById('questForm').reset();
                })
                .catch((err) => {
                    alert("❌ Lỗi: " + err.message);
                })
                .finally(() => {
                    submitBtn.disabled = false;
                });
        });

        // Load danh sách realtime
        function loadQuests() {
            questsRef.on('value', (snapshot) => {
                const listEl = document.getElementById('questList');
                listEl.innerHTML = '';
                const data = snapshot.val();

                if (!data) {
                    listEl.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#94a3b8;">Chưa có nhiệm vụ nào!</td></tr>';
                    return;
                }

                Object.keys(data).forEach(key => {
                    const q = data[key];
                    listEl.innerHTML += `
                        <tr>
                            <td><b>${q.title}</b><br><small style="color:#94a3b8">${q.desc || ''}</small></td>
                            <td><code>${q.type}</code></td>
                            <td>${q.target}</td>
                            <td>+${q.rewardExp} EXP</td>
                            <td><button class="btn-del" onclick="deleteQuest('${key}')">Xóa</button></td>
                        </tr>
                    `;
                });
            });
        }

        function deleteQuest(questKey) {
            if (confirm("Xóa nhiệm vụ này?")) {
                db.ref(`daily_quests/${questKey}`).remove();
            }
        }
    </script>
</body>
</html>
