<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Daily Quests</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 30px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #1e293b; padding: 24px; border-radius: 12px; margin-bottom: 24px; border: 1px solid #334155; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        h2, h3 { margin-top: 0; color: #f1f5f9; }
        input, select, button { padding: 12px; margin: 8px 0; width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #3b82f6; }
        button { background: #2563eb; font-weight: bold; cursor: pointer; border: none; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #334155; padding: 12px; text-align: left; }
        th { background: #0f172a; color: #94a3b8; }
        .btn-del { background: #ef4444; width: auto; padding: 6px 12px; margin: 0; }
        .btn-del:hover { background: #dc2626; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔥 Admin Management (Firebase)</h2>

        <!-- Form Thêm Nhiệm Vụ -->
        <div class="card">
            <h3>Thêm Nhiệm Vụ Hàng Ngày</h3>
            <form id="questForm">
                <input type="text" id="title" placeholder="Tên nhiệm vụ (VD: Chơi 3 trận Rank)" required>
                <input type="text" id="desc" placeholder="Mô tả ngắn">
                <select id="type">
                    <option value="PLAY_RANK">Chơi trận Rank</option>
                    <option value="WIN_SOLO">Thắng trận Solo</option>
                    <option value="COMPLETE_PUZZLE">Ghép xong 1 bức tranh</option>
                </select>
                <input type="number" id="target" placeholder="Mục tiêu (VD: 3)" required>
                <input type="number" id="rewardExp" placeholder="Điểm EXP thưởng (VD: 150)" required>
                <button type="submit" id="submitBtn">➕ Thêm Nhiệm Vụ</button>
            </form>
        </div>

        <!-- Danh sách Nhiệm Vụ Realtime -->
        <div class="card">
            <h3>Danh Sách Nhiệm Vụ Hiện Tại</h3>
            <table>
                <thead>
                    <tr>
                        <th>Tên & Mô tả</th>
                        <th>Loại</th>
                        <th>Cần đạt</th>
                        <th>Thưởng</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="questList">
                    <tr><td colspan="5" style="text-align:center;">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase App & Realtime Database SDKs (Compat/CDN Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        // Cấu hình Firebase
        const firebaseConfig = { 
        apiKey : "AIzaSyCpqwIbFqleWcid_7oE2GKbHJUCxhEGKDc" , 
        authDomain : "puzzle-online-auth.firebaseapp.com" , 
        databaseURL : "https://puzzle-online-auth-default-rtdb.asia-southeast1.firebasedatabase.app" , 
        projectId : "puzzle-online-auth" , 
        storageBucket : "puzzle-online-auth.firebasestorage.app" , 
        messagingSenderId : "733126189884" , 
        appId : "1:733126189884:web:b6c97174bc84e8478a7439" , 
        measurementId : "G-90X4YDGY7C" 
        };

        // Khởi tạo Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const questsRef = db.ref('daily_quests');

        // Thêm nhiệm vụ
        document.getElementById('questForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Đang xử lý...";

            const newQuest = {
                title: document.getElementById('title').value,
                desc: document.getElementById('desc').value,
                type: document.getElementById('type').value,
                target: Number(document.getElementById('target').value),
                rewardExp: Number(document.getElementById('rewardExp').value),
                createdAt: Date.now()
            };

            questsRef.push(newQuest)
                .then(() => {
                    alert("✅ Đã thêm nhiệm vụ thành công!");
                    document.getElementById('questForm').reset();
                })
                .catch((err) => {
                    alert("❌ Lỗi: " + err.message);
                    console.error(err);
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "➕ Thêm Nhiệm Vụ";
                });
        });

        // Lắng nghe dữ liệu realtime
        questsRef.on('value', (snapshot) => {
            const listEl = document.getElementById('questList');
            listEl.innerHTML = '';
            const data = snapshot.val();

            if (!data) {
                listEl.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#94a3b8;">Chưa có nhiệm vụ nào!</td></tr>';
                return;
            }

            Object.keys(data).forEach(key => {
                const q = data[key];
                listEl.innerHTML += `
                    <tr>
                        <td><b>${q.title}</b><br><small style="color:#94a3b8">${q.desc || ''}</small></td>
                        <td><code>${q.type}</code></td>
                        <td>${q.target}</td>
                        <td>+${q.rewardExp} EXP</td>
                        <td><button class="btn-del" onclick="deleteQuest('${key}')">Xóa</button></td>
                    </tr>
                `;
            });
        }, (err) => {
            console.error("Lỗi đọc Database:", err);
            document.getElementById('questList').innerHTML = `<tr><td colspan="5" style="color:#ef4444; text-align:center;">Lỗi tải dữ liệu: ${err.message}</td></tr>`;
        });

        // Xóa nhiệm vụ
        function deleteQuest(questKey) {
            if (confirm("Bạn có chắc muốn xóa nhiệm vụ này?")) {
                db.ref(`daily_quests/${questKey}`).remove();
            }
        }
    </script>
</body>
</html>
