<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin Management</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 30px; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: #1e293b; padding: 24px; border-radius: 12px; margin-bottom: 24px; border: 1px solid #334155; }
        h2, h3 { margin-top: 0; color: #f1f5f9; }
        input, select, button { padding: 12px; margin: 8px 0; width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; }
        button { background: #2563eb; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #1d4ed8; }
        .btn-gold { background: linear-gradient(135deg, #fbbf24, #d97706); color: #000; }
        .btn-logout { background: #64748b; width: auto; float: right; padding: 6px 16px; margin: 0; }
        .hidden { display: none !important; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #334155; padding: 12px; text-align: left; }
        th { background: #0f172a; color: #94a3b8; }
        .btn-del { background: #ef4444; width: auto; padding: 6px 12px; margin: 0; }
        .rank-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 10px; }
        .rank-item-box { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- FORM ĐĂNG NHẬP ADMIN -->
        <div id="loginSection" class="card" style="max-width: 400px; margin: 50px auto;">
            <h3>🔐 Đăng Nhập Admin</h3>
            <form id="loginForm">
                <input type="text" id="adminUser" placeholder="Tài khoản Admin" required>
                <input type="password" id="adminPass" placeholder="Mật khẩu" required>
                <button type="submit">Đăng Nhập</button>
            </form>
            <div id="loginError" style="color: #ef4444; margin-top: 10px; font-size: 13px;"></div>
        </div>

        <!-- GIAO DIỆN QUẢN TRỊ -->
        <div id="adminSection" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>🔥 Admin Management Dashboard</h2>
                <button class="btn-logout" onclick="logout()">Đăng xuất</button>
            </div>

            <!-- CẤU HÌNH QUÀ RANK -->
            <div class="card">
                <h3>🎁 Quản Lý phần thưởng Đấu Hạng (Rank Rewards)</h3>
                <p style="font-size: 12px; color: #94a3b8;">Tùy chỉnh số Vàng & Kim Cương người chơi nhận được khi đạt bậc Rank tương ứng.</p>
                
                <div class="rank-grid" id="rankRewardContainer">
                    <!-- Tự động sinh danh sách ô nhập quà từng bậc Rank -->
                </div>

                <button class="btn btn-gold" id="btnSaveRankRewards" style="margin-top: 15px;">💾 LƯU CẤU HÌNH QUÀ RANK</button>
            </div>

            <!-- QUẢN LÝ NHIỆM VỤ HÀNG NGÀY -->
            <div class="card">
                <h3>Thêm Nhiệm Vụ Hàng Ngày</h3>
                <form id="questForm">
                    <input type="text" id="title" placeholder="Tên nhiệm vụ (VD: Chơi 3 trận Rank)" required>
                    <input type="text" id="desc" placeholder="Mô tả ngắn">
                    <select id="type">
                        <option value="PLAY_RANK">Chơi trận Rank</option>
                        <option value="WIN_SOLO">Thắng trận Solo</option>
                        <option value="COMPLETE_PUZZLE">Ghép xong 1 bức tranh</option>
                    </select>
                    <input type="number" id="target" placeholder="Mục tiêu (VD: 3)" required>
                    <input type="number" id="rewardExp" placeholder="Điểm EXP/Vàng thưởng (VD: 150)" required>
                    <button type="submit" id="submitBtn">➕ Thêm Nhiệm Vụ</button>
                </form>
            </div>

            <div class="card">
                <h3>Danh Sách Nhiệm Vụ Hiện Tại</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Tên & Mô tả</th>
                            <th>Loại</th>
                            <th>Cần đạt</th>
                            <th>Thưởng</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="questList">
                        <tr><td colspan="5" style="text-align:center;">Đang tải dữ liệu...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- FIREBASE MODULAR SCRIPTS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey : "AIzaSyCpqwIbFqleWcid_7oE2GKbHJUCxhEGKDc" , 
            authDomain : "puzzle-online-auth.firebaseapp.com" , 
            databaseURL : "https://puzzle-online-auth-default-rtdb.asia-southeast1.firebasedatabase.app" , 
            projectId : "puzzle-online-auth" , 
            storageBucket : "puzzle-online-auth.firebasestorage.app" , 
            messagingSenderId : "733126189884" , 
            appId : "1:733126189884:web:b6c97174bc84e8478a7439"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const ADMIN_USER = "admin";
        const ADMIN_PASS = "123456";

        const RANKS = ['Đồng', 'Bạc', 'Vàng', 'Bạch Kim', 'Kim Cương', 'Siêu Kim Cương', 'Cao Thủ', 'Đại Cao Thủ', 'Thách Đấu', 'Siêu Thách Đấu'];

        const DEFAULT_REWARDS = {
            'Đồng': { gold: 300, gems: 10 },
            'Bạc': { gold: 500, gems: 20 },
            'Vàng': { gold: 1000, gems: 50 },
            'Bạch Kim': { gold: 2000, gems: 100 },
            'Kim Cương': { gold: 3500, gems: 150 },
            'Siêu Kim Cương': { gold: 5000, gems: 200 },
            'Cao Thủ': { gold: 8000, gems: 300 },
            'Đại Cao Thủ': { gold: 12000, gems: 500 },
            'Thách Đấu': { gold: 20000, gems: 1000 },
            'Siêu Thách Đấu': { gold: 30000, gems: 2000 }
        };

        if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
            showAdminDashboard();
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('adminUser').value;
            const p = document.getElementById('adminPass').value;

            if (u === ADMIN_USER && p === ADMIN_PASS) {
                sessionStorage.setItem('isAdminLoggedIn', 'true');
                showAdminDashboard();
            } else {
                document.getElementById('loginError').innerText = "Tài khoản hoặc mật khẩu không chính xác!";
            }
        });

        window.logout = function() {
            sessionStorage.removeItem('isAdminLoggedIn');
            location.reload();
        };

        async function showAdminDashboard() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('adminSection').classList.remove('hidden');
            await loadRankRewards();
        }

        async function loadRankRewards() {
            const container = document.getElementById('rankRewardContainer');
            container.innerHTML = '';

            let rewardsData = { ...DEFAULT_REWARDS };

            try {
                const docSnap = await getDoc(doc(db, "settings", "rank_rewards"));
                if (docSnap.exists()) {
                    rewardsData = { ...rewardsData, ...docSnap.data() };
                }
            } catch (err) {
                console.error("Lỗi tải quà rank:", err);
            }

            RANKS.forEach(rank => {
                const item = rewardsData[rank] || { gold: 100, gems: 10 };
                const div = document.createElement('div');
                div.className = 'rank-item-box';
                div.innerHTML = `
                    <div style="font-weight:bold; color:#fbbf24; margin-bottom: 5px;">Hạng ${rank}</div>
                    <div style="display:flex; gap: 8px;">
                        <input type="number" id="gold_${rank}" value="${item.gold}" placeholder="Vàng" style="margin:0;">
                        <input type="number" id="gems_${rank}" value="${item.gems}" placeholder="Kim cương" style="margin:0;">
                    </div>
                `;
                container.appendChild(div);
            });
        }

        document.getElementById('btnSaveRankRewards').addEventListener('click', async () => {
            const btn = document.getElementById('btnSaveRankRewards');
            btn.disabled = true;
            btn.innerText = "⏳ ĐANG LƯU CẤU HÌNH...";

            const updatedData = {};
            RANKS.forEach(rank => {
                const g = Number(document.getElementById(`gold_${rank}`).value) || 0;
                const d = Number(document.getElementById(`gems_${rank}`).value) || 0;
                updatedData[rank] = { gold: g, gems: d };
            });

            try {
                await setDoc(doc(db, "settings", "rank_rewards"), updatedData);
                alert("✅ Cập nhật phần thưởng Rank thành công!");
            } catch (err) {
                alert("❌ Lỗi lưu phần thưởng: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "💾 LƯU CẤU HÌNH QUÀ RANK";
            }
        });
    </script>
</body>
</html>
